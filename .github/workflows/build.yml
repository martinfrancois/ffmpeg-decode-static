name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Rust formatting
        working-directory: smoke-test
        run: |
          rustup toolchain install
          cargo fmt --check

  sources:
    name: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the source archives
        run: scripts/fetch-sources.sh
      # Every build job takes its sources from this artifact, so all targets
      # are built from the same verified files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources/
          if-no-files-found: error
          compression-level: 0

  build:
    name: ${{ matrix.target }}
    needs: sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-pc-windows-msvc-crt-static
            runner: windows-2022
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: sources

      - name: Build in the pinned container
        if: runner.os == 'Linux'
        env:
          CONTAINER_ENGINE: docker
        run: scripts/build-linux.sh "$TARGET"

      # The runner image already has Xcode's tools, GNU tar and xz.
      - name: Install nasm
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install nasm

      - name: Build on the runner
        if: runner.os == 'macOS'
        run: scripts/build.sh "$TARGET"

      # The runner image has MSYS2 in C:\msys64, but not on PATH.
      - name: Install the MSYS2 build tools
        if: runner.os == 'Windows'
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman --sync --noconfirm --needed make diffutils nasm pkgconf"

      - name: Build with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\msvc-env.cmd build.sh %TARGET%

      # bindgen reads the C library headers of the target, and the runner
      # only has the glibc ones.
      - name: Install the musl headers
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Smoke test
        if: runner.os != 'Windows'
        run: scripts/smoke-test.sh "$TARGET"

      - name: Smoke test with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\msvc-env.cmd smoke-test.sh %TARGET%

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-decode-static-${{ matrix.target }}
          path: dist/ffmpeg-decode-static-${{ matrix.target }}.tar.xz
          if-no-files-found: error
          compression-level: 0

  # The one check that branch rules require. It fails when any target fails.
  ci:
    name: ci
    if: always()
    needs: [lint, sources, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # Runs for a tag only, after every target was built and passed its smoke
  # test in this run. It is the one job that may write to the repository.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the check that the tag is on main.
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "error: $TAG is not on main" >&2
            exit 1
          }
      # The archive of every target and the source archives they were built from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Check the files, write the checksums and the release notes
        run: scripts/release.sh "$TAG" >dist/release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/release/* --verify-tag --title "$TAG" --notes-file dist/release-notes.md
